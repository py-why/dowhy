name: Resolve PR1868 lock
on:
  push:
    branches: [agents/resolve-pr1868-lock]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@v4.0.0
        with:
          poetry-version: "2.1.3"
      - run: poetry lock --no-interaction
      - run: poetry check --lock
      - uses: actions/upload-artifact@v4
        with:
          name: python313-compatible-lock
          path: poetry.lock
          if-no-files-found: error
  validate:
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: python313-compatible-lock
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: abatilo/actions-poetry@v4.0.0
        with:
          poetry-version: "2.1.3"
      - run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev pkg-config
      - name: Install locked core and test tools
        env:
          VIRTUALENV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          echo "VIRTUALENV_PYTHON=$VIRTUALENV_PYTHON" >> "$GITHUB_ENV"
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry sync --only main -E plotting -E pygraphviz -E econml
          poetry run python -m ensurepip
          poetry run python -m pip install pytest==8.4.1
      - name: Validate interpreter, native Graphviz, and Numba compilation
        run: |
          poetry run python -c "import sys; assert sys.version.split()[0] == '${{ steps.python.outputs.python-version }}', sys.version"
          poetry run python -c "import pygraphviz; g=pygraphviz.AGraph(string='digraph { a -> b; }'); assert g.has_edge('a', 'b'); print(pygraphviz.__version__)"
          poetry run python -c "import numba,numpy as np; f=numba.njit(lambda x: (x*x).sum()); assert f(np.arange(5)) == 30; print(numba.__version__,np.__version__)"
      - run: poetry run pytest -q tests/timeseries/test_temporal_causal_graph_creation.py::TestCreateGraphFromDotFormat
