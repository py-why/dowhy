# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'dowhy/**'
      - 'tests/**'
      - 'docs/source/example_notebooks/**'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci.yml'
      - 'dowhy/**'
      - 'tests/**'
      - 'docs/source/example_notebooks/**'
      - 'pyproject.toml'
      - 'poetry.lock'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13"]
        poetry-version: [2.1.3]
        test-group: [1, 2, 3, 4, 5, 6]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry ${{ matrix.poetry-version }}
      uses: abatilo/actions-poetry@v4.0.0
      with:
        poetry-version: ${{ matrix.poetry-version }}

    - name: Configure Poetry to use in-project virtualenv
      run: poetry config virtualenvs.in-project true

    - name: Cache virtualenv
      id: cache-venv
      uses: actions/cache@v6
      with:
        path: .venv
        # Discard environments containing native dependencies built with a different Python.
        key: venv-v3-${{ runner.os }}-${{ runner.arch }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ matrix.poetry-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
        restore-keys: |
          venv-v3-${{ runner.os }}-${{ runner.arch }}-py${{ steps.setup-python.outputs.python-version }}-poetry${{ matrix.poetry-version }}-

    - name: Select and verify Poetry Python
      env:
        # Poetry 2.1 passes only a discovery hint; virtualenv also needs the required interpreter.
        VIRTUALENV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        # Later dependency and wheel builds create their own isolated environments.
        echo "VIRTUALENV_PYTHON=$VIRTUALENV_PYTHON" >> "$GITHUB_ENV"
        poetry env use "${{ steps.setup-python.outputs.python-path }}"
        poetry run python -c "import sys; print(sys.executable, sys.version); assert sys.version.split()[0] == '${{ steps.setup-python.outputs.python-version }}', sys.version"

    - name: Free disk space for dependency installation
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        df -h /
        # These preinstalled SDKs are unused by the Python test suite.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet
        df -h /

    # At the moment needed to support scipy in Python 3.12+
    # Only required when building from source (i.e., no cached venv)
    - name: Install LLVM and Clang
      if: steps.cache-venv.outputs.cache-hit != 'true'
      uses: KyleMayes/install-llvm-action@v2.0.5
      with:
        version: "14.0"
        directory: ${{ runner.temp }}/llvm

    - name: Install graphviz
      run: |
        sudo apt install graphviz libgraphviz-dev graphviz-dev pkg-config

    - name: Install dependencies
      run: |
        "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip
        echo "installing poetry dependencies"
        # Validate the lock and refresh the editable project even on an exact cache hit.
        poetry sync -E plotting -E pygraphviz -E econml

    - name: Verify checkout and native imports
      run: |
        poetry run python -I -c "import importlib.util; from pathlib import Path; actual = Path(importlib.util.find_spec('dowhy').origin).resolve(); expected = Path('dowhy/__init__.py').resolve(); print(actual); assert actual == expected, (actual, expected)"
        poetry run python -I -c "import pygraphviz; graph = pygraphviz.AGraph(string='digraph { a -> b; }'); assert graph.has_edge('a', 'b'); print(pygraphviz.__version__, pygraphviz.__file__)"

    - name: Lint
      run: poetry run poe lint

    - name: Check Formatting
      run: poetry run poe format_check

    - name: Test
      run: poetry run poe test --splits 6 --group ${{ matrix.test-group }}

    - name: Test EconML based functionality
      run: poetry run poe test_econml

    - name: Test README errors for PyPI
      run: |
          pip install poetry-dynamic-versioning
          pip install twine
          poetry-dynamic-versioning
          poetry build
          twine check dist/*

    - name: Notify Discord
      if: failure() && github.ref == 'refs/heads/main'
      uses: th0th/notify-discord@v0.4.1
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_JOB_NAME: CI Failed on Main
        GITHUB_JOB_STATUS: ${{ job.status }}
