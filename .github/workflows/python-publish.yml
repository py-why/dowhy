# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  deploy:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python 3.9
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
    
    - name: Install Poetry
      uses: abatilo/actions-poetry@v4.0.0
      with:
        poetry-version: '2.1.3'

    - name: Install Poetry Dynamic Versioning Plugin
      run: '"${{ steps.setup-python.outputs.python-path }}" -m pip install poetry-dynamic-versioning'

    - name: Install dependencies
      env:
        VIRTUALENV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        echo "VIRTUALENV_PYTHON=$VIRTUALENV_PYTHON" >> "$GITHUB_ENV"
        poetry env use "${{ steps.setup-python.outputs.python-path }}"
        poetry run python -c "import sys; print(sys.executable, sys.version); assert sys.version.split()[0] == '${{ steps.setup-python.outputs.python-version }}', sys.version"
        poetry install
        
    - name: Build and publish
      run: |
        poetry-dynamic-versioning
        poetry build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
